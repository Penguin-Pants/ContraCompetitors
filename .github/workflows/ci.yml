name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CONTACT_EMAIL: takedown@example.com
      SOURCE_URL: https://github.com/Penguin-Pants/ContraCompetitors
      TRUST_PROXY_HOPS: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Before the tests: the server headless tests launch Chromium too.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Builds the image, then checks health, a non-root server, the Chromium sandbox (with the
      # Playwright seccomp profile) and a restart that keeps scores but no face data.
      - run: sh deploy/smoke-docker.sh
